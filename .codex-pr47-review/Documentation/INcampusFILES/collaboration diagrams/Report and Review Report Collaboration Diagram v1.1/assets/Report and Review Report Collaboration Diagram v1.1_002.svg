5" y1="1322.8125" y2="1322.8125"/></g><g class="entity" data-qualified-name="Admin" data-source-line="215" id="ent0002"><rect fill="#F1F1F1" height="105" rx="4.6875" ry="4.6875" style="stroke:#181818;stroke-width:0.9375;" width="320.1563" x="13.125" y="574.6875"/><text fill="#000000" font-family="Helvetica" font-size="22.5" font-style="italic" lengthAdjust="spacing" textLength="77.5415" x="134.4324" y="592.0129">&#171;Actor&#187;</text><text fill="#000000" font-family="Helvetica" font-size="22.5" lengthAdjust="spacing" textLength="153.8086" x="96.2988" y="618.2629">Campus Admin</text><text fill="#000000" font-family="Helvetica" font-size="22.5" lengthAdjust="spacing" textLength="293.9063" x="26.25" y="640.7629">(AuthenticatedAdminContext)</text><line style="stroke:#181818;stroke-width:0.9375;" x1="15" x2="331.4063" y1="649.6875" y2="649.6875"/></g><g class="entity" data-qualified-name="GMN16" data-source-line="236" id="ent0017"><path d="M585.6,319.6875 L585.6,435.9375 L1272.6145,435.9375 L1272.6145,338.4375 L1253.8645,319.6875 L585.6,319.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M1253.8645,319.6875 L1253.8645,338.4375 L1272.6145,338.4375 L1253.8645,319.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="647.6395" x="596.85" y="347.8317">The controller/service handoff is collapsed into message 16.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="322.4332" x="596.85" y="372.2067">SM updates DS-SM-002 only.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="568.9325" x="596.85" y="396.5817">No AP, H&amp;L, or NSF store is directly mutated by SM.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="612.3624" x="596.85" y="420.9567">remove_activity is recorded by SM but executed by H&amp;L.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="243" id="ent0020"><path d="M483.2813,76.875 L483.2813,168.75 L1374.9481,168.75 L1374.9481,95.625 L1356.1981,76.875 L483.2813,76.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M1356.1981,76.875 L1356.1981,95.625 L1374.9481,95.625 L1356.1981,76.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="556.9235" x="494.5313" y="105.0192">Messages 17a and 17b are conditional alternatives.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="852.2919" x="494.5313" y="129.3942">SM delegates account consequences to AP and activity consequences to H&amp;L.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="417.2672" x="494.5313" y="153.7692">No Campus Admin store is introduced.</text></g><!--link Admin to ReviewUI--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="229" id="lnk11"><path codeLine="229" d="M333.5063,640.9313 C464.6063,640.9313 637.4625,640.9313 766.1625,640.9313" fill="none" id="Admin-to-ReviewUI" style="stroke:#181818;stroke-width:1.875;"/><polygon fill="#181818" points="777.4125,640.9313,760.5375,633.4313,768.0375,640.9313,760.5375,648.4313,777.4125,640.9313" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="179.9854" x="375.4688" y="658.6879">15: submit outcome</text></g><!--link ReviewUI to Admin--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="233" id="lnk15"><path codeLine="233" d="M777.0563,613.4437 C648.5813,613.4437 476.3438,613.4437 345.4125,613.4437" fill="none" id="ReviewUI-to-Admin" style="stroke:#181818;stroke-width:1.875;"/><polygon fill="#181818" points="334.1625,613.4437,351.0375,620.9437,343.5375,613.4437,351.0375,605.9437,334.1625,613.4437" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="84.8364" x="469.35" y="631.2004">18: result</text></g><!--link ReviewService to Reports--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="230" id="lnk12"><path codeLine="230" d="M1051.2,873.4313 C1203.2813,873.4313 1448.4937,873.4313 1585.275,873.4313" fill="none" id="ReviewService-to-Reports" style="stroke:#181818;stroke-width:1.875;"/><polygon fill="#181818" points="1596.525,873.4313,1579.65,865.9313,1587.15,873.4313,1579.65,880.9313,1596.525,873.4313" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="312.4466" x="970.1339" y="891.1879">16: update outcome + action trace</text><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="354.0994" x="949.3074" y="911.8129">ModerationAction = none | warn_user |</text><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="392.4893" x="930.1125" y="932.4379">suspend_user | ban_user | remove_activity</text></g><!--link Dispatcher to AP--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" data-source-line="231" id="lnk13"><path codeLine="231" d="M928.7063,1133.8875 C928.7063,1245.75 928.7063,1544.0625 928.7063,1544.0625 C928.7063,1544.0625 1310.2312,1544.0625 1531.1625,1544.0625" fill="none" id="Dispatcher-to-AP" style="stroke:#181818;stroke-width:1.875;"/><polygon fill="#181818" points="1542.4125,1544.0625,1525.5375,1536.5625,1533.0375,1544.0625,1525.5375,1551.5625,1542.4125,1544.0625" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helv