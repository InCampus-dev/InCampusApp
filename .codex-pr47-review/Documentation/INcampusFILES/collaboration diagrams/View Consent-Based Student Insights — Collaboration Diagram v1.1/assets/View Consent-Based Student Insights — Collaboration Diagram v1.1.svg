" textLength="77.5415" x="1928.2636" y="1612.0129">&#171;Actor&#187;</text><text fill="#000000" font-family="Helvetica" font-size="22.5" lengthAdjust="spacing" textLength="153.8086" x="1890.1301" y="1638.2629">Campus Admin</text><text fill="#000000" font-family="Helvetica" font-size="22.5" lengthAdjust="spacing" textLength="293.9063" x="1820.0813" y="1660.7629">(AuthenticatedAdminContext)</text><line style="stroke:#181818;stroke-width:0.9375;" x1="1808.8313" x2="2125.2375" y1="1669.6875" y2="1669.6875"/></g><g class="entity" data-qualified-name="GMN28" data-source-line="113" id="ent0029"><path d="M11.25,644.0625 L11.25,760.3125 A0,0 0 0 0 11.25,760.3125 L298.425,760.3125 L305.925,1083.75 L313.425,760.3125 L686.0651,760.3125 A0,0 0 0 0 686.0651,760.3125 L686.0651,662.8125 L667.3151,644.0625 L11.25,644.0625 A0,0 0 0 0 11.25,644.0625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M667.3151,644.0625 L667.3151,662.8125 L686.0651,662.8125 L667.3151,644.0625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="368.5172" x="22.5" y="672.2067">No new admin store is introduced.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="635.4401" x="22.5" y="696.5817">AuthenticatedAdminContext is runtime/admin-auth context,</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="227.6825" x="22.5" y="720.9567">not a database table.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="368.541" x="22.5" y="745.3317">CA does not own AP or H&amp;L data.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="120" id="ent0032"><path d="M1635,76.875 L1635,168.75 L2299.0439,168.75 L2299.0439,95.625 L2280.2939,76.875 L1635,76.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M2280.2939,76.875 L2280.2939,95.625 L2299.0439,95.625 L2280.2939,76.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="598.8419" x="1646.25" y="105.0192">CampusInsightSharingConsent is stored in DS-AP-001.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="440.3448" x="1646.25" y="129.3942">If consent is false or revoked, identifiable</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="624.6689" x="1646.25" y="153.7692">insight access is denied and normal app usage continues.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="126" id="ent0035"><path d="M836.0625,609.375 L836.0625,701.25 A0,0 0 0 0 836.0625,701.25 L1153.425,701.25 L1160.925,851.4187 L1168.425,701.25 L1485.0029,701.25 A0,0 0 0 0 1485.0029,701.25 L1485.0029,628.125 L1466.2529,609.375 L836.0625,609.375 A0,0 0 0 0 836.0625,609.375" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M1466.2529,609.375 L1466.2529,628.125 L1485.0029,628.125 L1466.2529,609.375" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="552.7698" x="847.3125" y="637.5192">All insight access is campus-scoped and read-only.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="609.5654" x="847.3125" y="661.8942">No writes are performed to AP, H&amp;L, SM, or NSF stores.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="556.8045" x="847.3125" y="686.2692">Moderation/report-review access is a separate flow.</text></g><!--link Admin to InsightUI--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="98" id="lnk15"