.375" lengthAdjust="spacing" textLength="654.375" x="464.0625" y="323.4567">The controller/service handoff is collapsed into message 16.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="324.375" x="464.0625" y="347.8317">SM updates DS-SM-002 only.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="581.25" x="464.0625" y="372.2067">No AP, H&amp;L, or NSF store is directly mutated by SM.</text></g><g id="elem_GMN19"><path d="M346.875,76.875 L346.875,144.375 L1252.5,144.375 L1252.5,95.625 L1233.75,76.875 L346.875,76.875 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.9375;"/><path d="M1233.75,76.875 L1233.75,95.625 L1252.5,95.625 L1233.75,76.875 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="558.75" x="358.125" y="105.0192">Messages 17a and 17b are conditional alternatives.</text><text fill="#000000" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="866.25" x="358.125" y="129.3942">SM delegates account consequences to AP and activity consequences to H&amp;L.</text></g><!--link Admin to ReviewUI--><g id="link_Admin_ReviewUI"><path codeLine="121" d="M197.25,593.1188 C311.1188,593.1188 495.225,593.1188 632.55,593.1188 " fill="none" id="Admin-to-ReviewUI" style="stroke:#181818;stroke-width:1.875;"/><polygon fill="#181818" points="643.8,593.1188,626.925,585.6188,634.425,593.1188,626.925,600.6188,643.8,593.1188" style="stroke:#181818;stroke-width:1.875;"/><text fill="#000000" font-family="Helvetica" font-size="20.625" lengthAdjust="spacing" textLength="178.125" x="240.525" y="610.8754">15: submit outcome</text></g><!--link ReviewUI to Admin--><g id="link_ReviewUI_Admin"><path codeLine="125" d="M643.7813,565.6312 C506.5688,565.6312 322.65,565.6312 208.7625,565.6312 " fill="none" id="ReviewUI-to-Admin" style="stroke:#181818;