" x="134.432" y="592.013">«Actor»</text><text font-family="Helvetica" font-size="22.5" x="96.2988" y="618.263">Campus Admin</text><text font-family="Helvetica" font-size="22.5" x="26.25" y="640.763">(AuthenticatedAdminContext)</text><line x1="15" y1="649.688" x2="331.406" y2="649.688" stroke="#181818" stroke-width="0.9375"/></g><g id="ent0017"><path d="M585.6 319.688 585.6 435.938 1272.61 435.938 1272.61 338.438 1253.86 319.688 585.6 319.688" stroke="#181818" stroke-width="0.9375" fill="#FEFFDD"/><path d="M1253.86 319.688 1253.86 338.438 1272.61 338.438 1253.86 319.688" stroke="#181818" stroke-width="1.875" fill="#FEFFDD"/><text font-family="Helvetica" font-size="24.375" x="596.85" y="347.832">The controller/service handoff is collapsed into message 16.</text><text font-family="Helvetica" font-size="24.375" x="596.85" y="372.207">SM updates DS-SM-002 only.</text><text font-family="Helvetica" font-size="24.375" x="596.85" y="396.582">No AP, H&amp;L, or NSF store is directly mutated by SM.</text><text font-family="Helvetica" font-size="24.375" x="596.85" y="420.957">remove_activity is recorded by SM but executed by H&amp;L.</text></g><g id="ent0020"><path d="M483.281 76.875 483.281 168.75 1374.95 168.75 1374.95 95.625 1356.2 76.875 483.281 76.875" stroke="#181818" stroke-width="0.9375" fill="#FEFFDD"/><path d="M1356.2 76.875 1356.2 95.625 1374.95 95.625 1356.2 76.875" stroke="#181818" stroke-width="1.875" fill="#FEFFDD"/><text font-family="Helvetica" font-size="24.375" x="494.531" y="105.019">Messages 17a and 17b are conditional alternatives.</text><text font-family="Helvetica" font-size="24.375" x="494.531" y="129.394">SM delegates account consequences to AP and activity consequences to H&amp;L.</text><text font-family="Helvetica" font-size="24.375" x="494.531" y="153.769">No Campus Admin store is introduced.</text></g><g id="lnk11"><path d="M333.506 640.931C464.606 640.931 637.463 640.931 766.162 640.931" id="Admin-to-ReviewUI" stroke="#181818" stroke-width="1.875" 